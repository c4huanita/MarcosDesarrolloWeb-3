<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Categorías - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/estilos/sytless.css}">
    <link rel="icon" type="image/x-icon" th:href="@{/logo.ico}">
</head>

<body class="d-flex flex-column min-vh-100">

    <nav th:replace="~{fragments/header :: nav('admin')}"></nav>

    <main class="container my-5 flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Panel de Administración - Categorías</h2>
            <a th:href="@{/admin/categorias/nueva}" class="btn btn-primary d-flex align-items-center gap-2">
                <i class="bi bi-plus-circle"></i> Registrar nueva categoría
            </a>
        </div>

        <div class="row">
            <div class="col-md-3 mb-4">
                <div th:replace="~{fragments/sidebar :: menu('categorias')}"></div>
            </div>

            <div class="col-md-9">
                <div th:replace="~{fragments/alertas :: alertas}"></div>

                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-white fw-bold">Lista de Categorías</div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="text-center">ID</th>
                                        <th>Nombre</th>
                                        <th>Descripción</th>
                                        <th class="text-center">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="cat : ${categorias}">
                                        <td class="text-center" th:text="${cat.id}">1</td>
                                        <td class="fw-bold" th:text="${cat.nombre}">Cachorros</td>
                                        <td th:text="${cat.descripcion}">Mascotas menores a 6 meses</td>
                                        <td class="text-center">
                                            <a th:href="@{/admin/categorias/editar/{id}(id=${cat.id})}"
                                                class="btn btn-sm btn-outline-primary me-1">
                                                <i class="bi bi-pencil"></i> Editar
                                            </a>
                                            <a th:href="@{/admin/categorias/eliminar/{id}(id=${cat.id})}"
                                                class="btn btn-sm btn-outline-danger"
                                                onclick="return confirm('¿Seguro que deseas eliminar esta categoría?');">
                                                <i class="bi bi-trash"></i> Eliminar
                                            </a>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(categorias)}">
                                        <td colspan="4" class="text-center py-4 text-muted">No hay categorías registradas.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal para Registrar / Editar Categoría -->
    <div class="modal fade" id="modalCategoria" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/admin/categorias/guardar}" th:object="${categoriaNueva}" method="post" novalidate>
                    <input type="hidden" th:field="*{id}" />

                    <div class="modal-header">
                        <h5 class="modal-title"
                            th:text="${categoriaNueva.id == null} ? 'Registrar Categoría' : 'Editar Categoría'">
                            Gestión de Categoría</h5>
                        <a th:href="@{/admin/categorias}" class="btn-close" aria-label="Close"></a>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Nombre de la Categoría *</label>
                            <input type="text" class="form-control" th:field="*{nombre}" placeholder="Ej: Cachorros"
                                th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" th:field="*{descripcion}" rows="3"
                                placeholder="Breve descripción..."
                                th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid'"></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <a th:href="@{/admin/categorias}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Guardar Categoría</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Abre el modal al registrar, editar o cuando hay errores de validación -->
    <script th:if="${abrirModal}">
        document.addEventListener("DOMContentLoaded", function () {
            new bootstrap.Modal(document.getElementById('modalCategoria')).show();
        });
    </script>
</body>

</html>
